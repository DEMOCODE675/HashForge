<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Icon: Cryptographic Anvil / Hash Node -->
  <g transform="translate(15, 10)">
    <!-- Outer Shield / Hex Block -->
    <polygon points="50,5 90,28 90,75 50,98 10,75 10,28" 
             fill="url(#boxGrad)" stroke="url(#cyanGrad)" stroke-width="2.5" />
    
    <!-- Anvil / Core Forge Shape -->
    <path d="M30,35 L70,35 L62,52 L74,52 L74,60 L26,60 L26,52 L38,52 Z" 
          fill="none" stroke="#00F0FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Binary Matrix Nodes & Glowing Core -->
    <circle cx="50" cy="52" r="4.5" fill="#10B981" filter="url(#glow)" />
    <circle cx="32" cy="24" r="2.5" fill="#00F0FF" />
    <circle cx="68" cy="24" r="2.5" fill="#00F0FF" />
    <circle cx="50" cy="78" r="2.5" fill="#10B981" />
    
    <!-- Connection lines -->
    <line x1="32" y1="24" x2="46" y2="48" stroke="#00F0FF" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.7" />
    <line x1="68" y1="24" x2="54" y2="48" stroke="#00F0FF" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.7" />
    <line x1="50" y1="56" x2="50" y2="76" stroke="#10B981" stroke-width="1.5" />
  </g>

  <!-- Typography: HASHFORGE -->
  <text x="125" y="65" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" 
        font-size="44" font-weight="900" letter-spacing="4" fill="#F8FAFC">
    HASH<tspan fill="url(#cyanGrad)">FORGE</tspan>
  </text>
  
  <!-- Subtitle: Cryptography & Avalanche Lab -->
  <text x="128" y="90" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" 
        font-size="12" font-weight="600" letter-spacing="2.5" fill="#94A3B8">
    CRYPTOGRAPHIC HASHING &amp; AVALANCHE EFFECT LAB
  </text>

  <!-- Status pill -->
  <g transform="translate(415, 30)">
    <rect width="65" height="20" rx="10" fill="#111827" stroke="#10B981" stroke-width="1" />
    <circle cx="12" cy="10" r="3.5" fill="#10B981" filter="url(#glow)" />
    <text x="22" y="14" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#10B981" letter-spacing="1">
      v2.0
    </text>
  </g>
</svg>

